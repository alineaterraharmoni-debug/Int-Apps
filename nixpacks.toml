providers = ["php"]

[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.bcmath", "php82Extensions.gd", "php82Extensions.zip", "php82Extensions.dom"]

# mkdir + chmod + composer install digabung jadi satu phase biar gak ke-split
# lintas layer build — ini akar masalah "Please provide a valid cache path" kemarin:
# storage/framework/views dst harus SUDAH ada sebelum Laravel resolve config apapun.
[phases.build]
cmds = [
  "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/framework/testing storage/logs bootstrap/cache",
  "chmod -R a+rwX storage bootstrap/cache",
  "composer install --no-dev --optimize-autoloader --no-interaction"
]

[start]
# mkdir diulang lagi di sini sebagai pengaman kalau runtime container-nya
# beda dari build container (beberapa platform pakai image terpisah).
cmd = "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache/data storage/framework/testing storage/logs bootstrap/cache && chmod -R a+rwX storage bootstrap/cache && php artisan migrate --force && php artisan serve --host 0.0.0.0 --port $PORT"
